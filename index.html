<title>Rootbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: full-bleed 3D table; HUD floats on top — party left, Skyship right, actions bottom. */
:root {
  color-scheme: dark;
  --ink: #f3e6c8;          /* parchment text */
  --ink-dim: #c4b08a;
  --ink-faint: #8f7c5c;
  --wood: #1b120b;          /* table shadow */
  --panel: rgba(24, 16, 10, 0.86);
  --panel-solid: #22170e;
  --edge: #6a5432;
  --gold: #e0b45a;          /* compass gold */
  --gold-bright: #ffd987;
  --moss: #6f9a3e;
  --blight: #ff3d9a;
  --danger: #e2484f;
  --parch: #efe2c4;
  --parch-green: #dfe6bf;
  --parch-pink: #f2d3d8;
  --parch-ink: #2c1d10;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "EB Garamond", Garamond, Georgia, serif;
  --r: 10px;
}
html, body { height: 100%; }
body { background: var(--wood); color: var(--ink); font-family: var(--body); font-size: 17px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
#app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }

/* ---------- shared bits ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
  font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
  background: linear-gradient(#3b2a19, #26190e); border: 1px solid var(--edge); color: var(--ink);
  box-shadow: inset 0 1px 0 rgba(255,220,150,0.12), 0 2px 6px rgba(0,0,0,0.4);
  transition: transform .12s, border-color .12s, filter .12s;
}
.btn:hover:not(:disabled) { border-color: var(--gold); filter: brightness(1.15); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn.primary { background: linear-gradient(#e6bd62, #b5862f); color: #2a1a08; border-color: #f3d48a; }
.btn.danger { border-color: #7a2a35; }
.btn.small { min-height: 30px; padding: 3px 9px; font-size: 11px; }
.eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: 0 8px 30px rgba(0,0,0,0.5); backdrop-filter: blur(6px); }
.tok { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.tok.lg { width: 30px; height: 30px; }
.cost { display: inline-flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.cost span { display: inline-flex; align-items: center; gap: 1px; font-weight: 600; }
.heart { display: inline-block; width: 15px; height: 14px; background: var(--danger); clip-path: path("M7.5 13.5 1.2 7.2A3.7 3.7 0 0 1 7.5 2a3.7 3.7 0 0 1 6.3 5.2Z"); }
.heart.empty { background: #4a2f2f; }
.hidden { display: none !important; }

/* ---------- title / lobby ---------- */
#title {
  position: absolute; inset: 0; overflow-y: auto; z-index: 30;
  background: radial-gradient(ellipse at 50% 0%, #2a1c10, #0c0805 70%);
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.title-inner { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.cover { width: 100%; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); border: 1px solid var(--edge); aspect-ratio: 1360 / 768; object-fit: cover; }
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; margin-top: -70px; position: relative; padding-inline: 18px; }
.lobby-card { padding: 18px; display: grid; gap: 14px; align-content: start; }
.lobby-card h2 { font-family: var(--display); font-size: 20px; margin: 0; color: var(--gold-bright); letter-spacing: 0.04em; text-wrap: balance; }
.lobby-card p { margin: 0; color: var(--ink-dim); line-height: 1.45; }
.field { display: grid; gap: 4px; }
.field label { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.field input, .field select {
  min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--edge); background: #140d07; color: var(--ink); font: inherit;
}
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: #140d07; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #24170a; font-weight: 600; }
.settings { display: flex; flex-wrap: wrap; gap: 14px 22px; }
.game-list { display: grid; gap: 8px; max-height: 300px; overflow-y: auto; }
.game-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: 8px; background: rgba(0,0,0,0.25); }
.game-row .meta { flex: 1; min-width: 0; }
.game-row .meta strong { font-family: var(--display); font-size: 14px; display: block; }
.game-row .meta small { color: var(--ink-faint); }
.note { font-size: 15px; color: var(--ink-faint); line-height: 1.45; }
.note code { font-family: inherit; color: var(--ink-dim); }

/* waiting room */
#room { position: absolute; inset: 0; z-index: 25; overflow-y: auto; background: radial-gradient(ellipse at 50% 0%, #2c1d10, #0c0805 70%);
  padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.room-inner { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
.room-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.room-head h1 { font-family: var(--display); margin: 0; font-size: 30px; color: var(--gold-bright); text-wrap: balance; }
.chars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.char-card { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--edge); background: var(--parch); color: var(--parch-ink); display: grid; grid-template-rows: auto 1fr; }
.char-card img { width: 100%; aspect-ratio: 4 / 4.2; object-fit: cover; object-position: top; background: #e6d8b8; }
.char-card .body { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
.char-card h3 { margin: 0; font-family: var(--display); font-size: 18px; }
.char-card .role { font-family: var(--display); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b4d24; }
.char-card .ability { font-size: 15px; line-height: 1.35; }
.char-card .ability b { font-family: var(--display); font-size: 12px; letter-spacing: 0.06em; }
.char-card .quote { font-style: italic; font-size: 14px; color: #5d4630; }
.char-card.taken { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(224,180,90,0.4); }
.char-card .seat { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: center; }
.char-card .seat span { background: rgba(20,12,6,0.86); color: var(--gold-bright); font-family: var(--display); font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--gold); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
.topbar {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(rgba(12,8,5,0.92), rgba(12,8,5,0));
}
.brand { font-family: var(--display); font-weight: 900; letter-spacing: 0.12em; font-size: 20px; color: var(--gold-bright); text-shadow: 0 2px 8px #000; }
.round-chip { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 13px; letter-spacing: 0.06em; }
.round-chip .ph { width: 22px; height: 22px; border-radius: 50%; }
.ph.day { background: radial-gradient(circle at 40% 40%, #fff1b5, #f0b43b 60%, #a8721b); box-shadow: 0 0 10px #f0b43b; }
.ph.night { background: radial-gradient(circle at 65% 35%, transparent 38%, #cfd8ff 40%); box-shadow: 0 0 10px #8fa2ff; }
.weather-chip { display: flex; align-items: center; gap: 8px; cursor: pointer; background: rgba(0,0,0,0.35); border: 1px solid var(--edge); border-radius: 8px; padding: 3px 10px 3px 3px; }
.weather-chip img { width: 34px; height: 46px; object-fit: cover; border-radius: 4px; }
.weather-chip span { font-family: var(--display); font-size: 12px; }
.weather-chip small { display: block; font-family: var(--body); font-size: 13px; color: var(--ink-dim); max-width: 26ch; }
.horror { flex: 1; min-width: 220px; display: grid; gap: 3px; }
.horror .lbl { display: flex; justify-content: space-between; font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.horror .lbl b { color: var(--blight); }
.track { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
.track i { height: 12px; border-radius: 2px; background: #2a1820; border: 1px solid #4a2a38; position: relative; }
.track i.on { background: linear-gradient(#ff5fb0, #b3176a); border-color: #ff7cc0; box-shadow: 0 0 6px rgba(255,61,154,.6); }
.track i.spawn::after { content: ""; position: absolute; left: 50%; top: -7px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--blight); }
.track i.king { background: #3a0f1f; border-color: var(--blight); }
.top-actions { display: flex; gap: 6px; }

.side { position: absolute; top: 92px; bottom: 112px; width: 300px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 2px; }
.side.left { left: max(12px, env(safe-area-inset-left, 0px)); }
.side.right { right: max(12px, env(safe-area-inset-right, 0px)); }
.side .panel { padding: 12px; }
.side h3 { margin: 0 0 8px; font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }

.pcard { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 8px; border-radius: 9px; border: 1px solid transparent; }
.pcard + .pcard { margin-top: 6px; }
.pcard.active { border-color: var(--gold); background: rgba(224,180,90,0.1); }
.pcard.lost { opacity: 0.55; filter: grayscale(0.6); }
.pcard img.face { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid var(--edge); background: #e6d8b8; }
.pcard .nm { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.pcard .nm strong { font-family: var(--display); font-size: 14px; }
.pcard .nm small { color: var(--ink-faint); font-size: 13px; }
.pcard .stats { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 14px; color: var(--ink-dim); }
.bag { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-variant-numeric: tabular-nums; font-size: 14px; }
.bag span { display: inline-flex; align-items: center; gap: 2px; }
.slots { font-size: 12px; color: var(--ink-faint); }
.tag { font-family: var(--display); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--edge); color: var(--ink-dim); }
.tag.you { border-color: var(--gold); color: var(--gold-bright); }
.tag.lost { border-color: var(--danger); color: #ff9ca0; }

.ship-art { width: 100%; border-radius: 8px; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
.parts { display: grid; gap: 6px; margin-top: 8px; }
.part { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,0.25); border: 1px solid #3c2d1b; }
.part.done { border-color: var(--moss); background: rgba(111,154,62,0.15); }
.part .pn { font-family: var(--display); font-size: 12px; }
.store { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.store button { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 36px; border-radius: 8px; border: 1px solid #3c2d1b; background: rgba(0,0,0,0.25); cursor: pointer; font-variant-numeric: tabular-nums; }
.store button:disabled { cursor: default; opacity: .75; }
.log { display: grid; gap: 4px; font-size: 14.5px; line-height: 1.35; color: var(--ink-dim); max-height: 220px; overflow-y: auto; }
.log div b { color: var(--ink-faint); font-weight: 500; font-variant-numeric: tabular-nums; }

.actionbar {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  width: min(900px, calc(100% - 660px)); min-width: 480px; padding: 10px 12px; display: grid; gap: 8px;
}
@media (max-width: 1100px) { .actionbar { width: calc(100% - 580px); } }
.bar-handle { justify-self: center; display: flex; align-items: center; gap: 8px; margin: -6px 0 -2px; padding: 2px 12px 4px; min-height: 28px;
  border: 0; background: none; cursor: pointer; color: var(--ink-faint); font-family: var(--display); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }
.bar-handle .grip { width: 40px; height: 4px; border-radius: 4px; background: var(--edge); }
.bar-handle:hover { color: var(--gold-bright); }
.actionbar.min { gap: 2px; padding-block: 6px; }
.actionbar.min .actions, .actionbar.min .turn-line .hint { display: none; }
.actionbar.min .bar-handle { color: var(--gold-bright); }
.turn-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.turn-line .who { font-family: var(--display); font-size: 15px; color: var(--gold-bright); }
.turn-line .hint { font-size: 15px; color: var(--ink-dim); flex: 1; min-width: 180px; }
.pips { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-dim); }
.pips b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pip { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--gold); display: inline-block; }
.pip.on { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.actions > * { max-width: 100%; }
.actions .btn { white-space: normal; text-align: left; }
.actions select.btn { width: 170px; text-transform: none; letter-spacing: 0.02em; }

.tile-tip { position: absolute; left: 50%; transform: translateX(-50%); top: 96px; padding: 6px 12px; font-size: 15px; pointer-events: none !important; white-space: nowrap; }
.tile-tip b { font-family: var(--display); font-size: 13px; letter-spacing: 0.05em; }

/* toasts */
#toasts { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; z-index: 40; pointer-events: none; }
.toast { padding: 7px 14px; border-radius: 99px; background: rgba(20,12,6,0.92); border: 1px solid var(--edge); font-size: 15px; animation: toast 3.2s forwards; display: flex; gap: 6px; align-items: center; }
.toast.bad { border-color: #8a2b45; color: #ffc2d6; }
.toast.good { border-color: #5e7c33; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* card modal */
#modal { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(6,4,2,0.62); backdrop-filter: blur(2px);
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.modal-inner { display: grid; gap: 14px; justify-items: center; max-width: 100%; }
.cards-row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.card-wrap { display: grid; gap: 10px; justify-items: center; }
.card-face { width: min(330px, 80vw); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); animation: cardIn .6s cubic-bezier(.2,.8,.2,1); transform-origin: center; }
@keyframes cardIn { from { transform: rotateY(90deg) scale(.8); opacity: .2; } to { transform: none; opacity: 1; } }
img.card-face { display: block; height: auto; }
.card-note { max-width: 330px; text-align: center; font-size: 15px; color: var(--ink-dim); font-style: italic; }
.modal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* drafted card (no printed art yet) */
.draft { position: relative; aspect-ratio: 5 / 7.4; padding: 12px; background: linear-gradient(145deg, #4a5e2a, #2b3a17 40%, #5b4a24); border: 3px solid #8b7a3c; display: grid; grid-template-rows: 1fr auto; gap: 0; overflow: hidden; }
.draft.corrupt { background: linear-gradient(145deg, #5a1a44, #2a0d22 45%, #6b2450); border-color: #c0407f; }
.draft .art { border-radius: 10px 10px 4px 4px; background-size: cover; background-position: center; border: 2px solid #c9a75a; min-height: 0; }
.draft.corrupt .art { border-color: #e05aa0; filter: saturate(1.2) hue-rotate(-12deg); }
.draft .star { position: absolute; top: 4px; left: 50%; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%; background: radial-gradient(circle, #f3d48a 0 18%, #6b4d1a 20% 34%, #d8b45a 36% 62%, #3b2a12 64%); border: 2px solid #f3d48a; }
.draft .text { background: radial-gradient(ellipse at center, var(--parch-green), #b9c48a); color: var(--parch-ink); margin-top: -8px; border-radius: 10px; padding: 12px 12px 14px; text-align: center; display: grid; gap: 4px; border: 2px solid #8b7a3c; }
.draft.corrupt .text { background: radial-gradient(ellipse at center, var(--parch-pink), #d9a2b1); border-color: #c0407f; }
.draft h4 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 21px; line-height: 1.1; text-wrap: balance; }
.draft .sub { font-family: var(--display); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 1px solid rgba(44,29,16,0.4); padding-bottom: 4px; }
.draft .fl { font-style: italic; font-size: 14.5px; }
.draft .fx { font-size: 16px; font-weight: 500; }
.draft .badge { position: absolute; bottom: 8px; right: 10px; font-family: var(--display); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: rgba(44,29,16,0.6); }

/* end screen */
.end h2 { font-family: var(--display); font-size: 34px; margin: 0; color: var(--gold-bright); text-align: center; text-wrap: balance; }
.end p { text-align: center; max-width: 46ch; font-size: 19px; margin: 0; }

/* guide */
.guide { max-width: 760px; padding: 20px 22px; max-height: 86vh; overflow-y: auto; line-height: 1.5; }
.guide h2 { font-family: var(--display); color: var(--gold-bright); margin: 0 0 6px; }
.guide h3 { font-family: var(--display); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin: 16px 0 4px; }
.guide p, .guide li { color: var(--ink-dim); max-width: 68ch; }
.guide ul { padding-left: 20px; margin: 4px 0; }

/* ---------- title screen: the cover art is the stage ---------- */
#title { padding: 0; background: #0b0805; overflow: hidden auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero { position: absolute; inset: 0; overflow: hidden; }
.hero-stage { position: absolute; left: 0; top: 50%; width: max(100vw, 177.46vh); height: max(100vh, 56.35vw);
  transform: translateY(-50%); transform-origin: 20% 50%; animation: drift 38s ease-in-out infinite alternate; }
.hero-art { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; animation: heroIn 2.2s ease-out both; }
@keyframes heroIn { from { opacity: 0; filter: brightness(.3) blur(6px); } to { opacity: 1; filter: none; } }
@keyframes drift { from { transform: translateY(-50%) scale(1.02); } to { transform: translate(-1%, -49.4%) scale(1.07); } }
.hero-fire { position: absolute; left: 59%; top: 82%; width: 22%; height: 30%; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(255,160,60,.55), rgba(255,110,30,.18) 55%, transparent);
  mix-blend-mode: screen; animation: flicker 2.6s infinite; }
@keyframes flicker { 0%,100% { opacity: .75; } 12% { opacity: .95; } 25% { opacity: .7; } 41% { opacity: 1; } 58% { opacity: .8; } 77% { opacity: .95; } }
.hero-eye { position: absolute; width: 2.2%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,210,150,.95), rgba(255,120,40,.5) 40%, transparent);
  mix-blend-mode: screen; opacity: 0; animation: eyes 7s ease-in-out 2.5s infinite; }
@keyframes eyes { 0%,40%,100% { opacity: .15; } 55% { opacity: 1; } 70% { opacity: .55; } }
.hero-motes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(8,5,3,.82) 0%, rgba(8,5,3,.45) 26%, transparent 46%),
              radial-gradient(ellipse 120% 90% at 55% 45%, transparent 55%, rgba(5,3,2,.7)); }
