<script>
// A virtual clock: the capture script advances time frame by frame, so animations come out
// smooth however slowly this machine renders.
(() => {
  let T = 0; const start = 1795000000000;
  const timers = []; let raf = []; let seq = 0;
  performance.now = () => T;
  Date.now = () => start + T;
  window.setTimeout = (fn, ms = 0, ...a) => { const id = ++seq; timers.push({ id, at: T + Math.max(0, ms), fn: () => fn(...a) }); return id; };
  window.clearTimeout = (id) => { const i = timers.findIndex((x) => x.id === id); if (i >= 0) timers.splice(i, 1); };
  window.setInterval = (fn, ms) => { const tick = () => { fn(); window.setTimeout(tick, ms); }; return window.setTimeout(tick, ms); };
  window.requestAnimationFrame = (fn) => { raf.push(fn); return raf.length; };
  window.cancelAnimationFrame = () => {};
  window.__now = () => T;
  window.__step = (dt) => {
    T += dt;
    for (;;) {
      timers.sort((a, b) => a.at - b.at);
      if (!timers.length || timers[0].at > T) break;
      timers.shift().fn();
    }
    if (window.__beforeFrame) window.__beforeFrame(T);
    const q = raf; raf = []; for (const f of q) f(T);
  };
})();
</script>
